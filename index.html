<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="あなたに合う副業を無料診断できる副業ナビ">
<title>副業ナビ｜無料副業診断</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;
background:#f3f4f6;
color:#111827;
}

.container{
max-width:560px;
margin:auto;
min-height:100vh;
background:white;
}

.header{
background:linear-gradient(135deg,#111827,#1d4ed8);
color:white;
text-align:center;
padding:42px 20px;
}

.logo{
font-size:13px;
letter-spacing:4px;
opacity:.8;
}

.header h1{
font-size:34px;
margin:12px 0 8px;
}

.header p{
margin:0;
opacity:.9;
}

.content{
padding:25px 20px 45px;
}

.progress{
height:7px;
background:#e5e7eb;
border-radius:20px;
overflow:hidden;
margin-bottom:25px;
}

.progress-bar{
height:100%;
width:0;
background:#2563eb;
transition:.3s;
}

.question-number{
font-size:13px;
color:#6b7280;
margin-bottom:8px;
}

.question{
font-size:23px;
font-weight:bold;
line-height:1.5;
margin-bottom:20px;
}

.option{
display:block;
width:100%;
padding:17px;
margin-bottom:12px;
border:1px solid #d1d5db;
border-radius:14px;
background:white;
text-align:left;
font-size:16px;
cursor:pointer;
}

.option.selected{
border:2px solid #2563eb;
background:#eff6ff;
color:#1d4ed8;
font-weight:bold;
}

.next-btn,
.restart-btn,
.share-btn{
width:100%;
border:0;
border-radius:13px;
padding:16px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.next-btn{
background:#2563eb;
color:white;
}

.next-btn:disabled{
background:#9ca3af;
}

.result-title{
text-align:center;
font-size:28px;
}

.result-subtitle{
text-align:center;
color:#6b7280;
}

.result-card{
border:1px solid #e5e7eb;
border-radius:18px;
padding:20px;
margin:18px 0;
box-shadow:0 6px 20px rgba(0,0,0,.05);
}

.rank{
display:inline-block;
background:#111827;
color:white;
padding:5px 10px;
border-radius:20px;
font-size:12px;
}

.tag{
display:inline-block;
background:#eff6ff;
color:#2563eb;
padding:5px 10px;
border-radius:20px;
font-size:12px;
margin-left:5px;
}

.result-card h3{
font-size:21px;
margin:12px 0;
}

.result-card p{
line-height:1.7;
color:#374151;
}

.start{
background:#f8fafc;
padding:15px;
border-radius:12px;
margin-top:15px;
}

.start li{
margin-bottom:7px;
}

.detail-btn{
display:block;
text-align:center;
text-decoration:none;
background:#2563eb;
color:white;
padding:14px;
border-radius:12px;
margin-top:16px;
font-weight:bold;
}

.cta{
margin-top:25px;
padding:22px;
border-radius:17px;
background:linear-gradient(135deg,#111827,#1e3a8a);
color:white;
text-align:center;
}

.line-btn{
display:block;
background:#06c755;
color:white;
padding:15px;
border-radius:12px;
text-decoration:none;
font-weight:bold;
margin-top:15px;
}

.share-btn{
background:white;
color:#111827;
margin-top:12px;
}

.restart-btn{
background:#e5e7eb;
color:#111827;
margin-top:12px;
}

.notice{
font-size:11px;
color:#9ca3af;
line-height:1.7;
margin-top:20px;
}

.footer{
text-align:center;
font-size:12px;
color:#9ca3af;
padding:25px;
}

.hidden{
display:none;
}
</style>
</head>

<body>

<div class="container">

<header class="header">

<div class="logo">
SIDE JOB NAVI
</div>

<h1>副業ナビ</h1>

<p>
あなたに合う副業を無料診断
</p>

</header>

<main class="content">

<section id="quiz">

<div class="progress">
<div id="progressBar" class="progress-bar"></div>
</div>

<div id="questionNumber" class="question-number"></div>

<div id="question" class="question"></div>

<div id="options"></div>

<button
id="nextButton"
class="next-btn"
disabled>
次へ
</button>

</section>


<section id="result" class="hidden">

<h2 class="result-title">
診断結果
</h2>

<p class="result-subtitle">
あなたにおすすめの副業候補です
</p>

<div id="resultCards"></div>


<div class="cta">

<h3>
副業を始めてみたい方へ
</h3>

<p>
自分に合う方法を知るところから
始めてみましょう。
</p>

<a
class="line-btn"
href="#"
onclick="lineComingSoon();return false;">
無料相談はこちら
</a>

<button
id="shareButton"
class="share-btn">
診断結果をシェア
</button>

</div>


<p class="notice">
※診断結果はあくまで目安です。
副業による収入を保証するものではありません。
サービスを利用する場合は、各サービスの料金・利用条件をご確認ください。
</p>


<button
id="restartButton"
class="restart-btn">
もう一度診断する
</button>

</section>

</main>


<footer class="footer">
© 2026 副業ナビ
</footer>

</div>


<script>

const questions = [

{
question:"1日に副業へ使える時間は？",
options:[
["30分〜1時間","short"],
["1〜2時間","middle"],
["3時間以上","long"]
]
},

{
question:"初期費用はいくらまで使えますか？",
options:[
["できるだけ0円","free"],
["1万円程度","small"],
["5万円以上でもOK","investment"]
]
},

{
question:"顔出しはできますか？",
options:[
["絶対にしたくない","noface"],
["どちらでもいい","normal"],
["顔出しできる","face"]
]
},

{
question:"PCは持っていますか？",
options:[
["持っていない","smartphone"],
["持っている","pc"]
]
},

{
question:"どれくらい稼ぎたいですか？",
options:[
["月1〜3万円","low"],
["月5〜10万円","middleincome"],
["月10万円以上を目指したい","high"]
]
},

{
question:"興味があることは？",
options:[
["商品・買い物","shopping"],
["SNS・動画","sns"],
["PC作業","pcwork"],
["人と話すこと","communication"]
]
},

{
question:"副業で一番重視することは？",
options:[
["できるだけ低コストで始めたい","easy"],
["収入を大きくしたい","income"],
["スキルを身につけたい","skill"]
]
}

];


const data = {

affiliate:{
title:"アフィリエイト",
tag:"スマホ・PC向け",
description:
"商品やサービスを紹介し、条件を満たした成果に応じて報酬を得る方法です。",
income:
"収入：成果数やアクセス数などによって変動",
steps:[
"紹介するジャンルを決める",
"SNSやブログなどで情報発信",
"紹介リンクを設置",
"アクセスや成果を確認"
]
},

sns:{
title:"SNS・動画発信",
tag:"SNS向け",
description:
"X・Threads・TikTokなどで情報発信し、広告やアフィリエイトなどにつなげる方法です。",
income:
"収入：案件・成果・アクセスなどによって変動",
steps:[
"発信ジャンルを決める",
"SNSアカウントを作る",
"継続的に投稿する",
"収益化方法を組み合わせる"
]
},

web:{
title:"Web制作・デジタル作業",
tag:"PC向け",
description:
"Webサイト制作やデジタル作業など、PCスキルを活用する副業です。",
income:
"収入：案件単価・案件数などによって変動",
steps:[
"必要なスキルを学ぶ",
"作品を作る",
"ポートフォリオを作る",
"案件へ応募する"
]
},

resale:{
title:"ネット物販",
tag:"商品販売",
description:
"商品を仕入れて販売し、販売価格と仕入れ価格などの差額から利益を得る方法です。",
income:
"収入：販売数・利益率・経費などによって変動",
steps:[
"販売ジャンルを決める",
"商品の需要を調べる",
"利益を計算する",
"販売・発送する"
]
}

};


let currentQuestion=0;
let answers=[];


const question=
document.getElementById("question");

const questionNumber=
document.getElementById("questionNumber");

const options=
document.getElementById("options");

const nextButton=
document.getElementById("nextButton");

const progressBar=
document.getElementById("progressBar");


function loadQuestion(){

const q=
questions[currentQuestion];

questionNumber.textContent=
"質問 "+(currentQuestion+1)+" / "+questions.length;

question.textContent=
q.question;

options.innerHTML="";

nextButton.disabled=true;


q.options.forEach(function(option){

const button=
document.createElement("button");

button.className="option";

button.textContent=
option[0];

button.onclick=function(){

document
.querySelectorAll(".option")
.forEach(function(btn){

btn.classList.remove("selected");

});

button.classList.add("selected");

answers[currentQuestion]=
option[1];

nextButton.disabled=false;

};

options.appendChild(button);

});


progressBar.style.width=
(currentQuestion/questions.length*100)+"%";

}


nextButton.onclick=function(){

if(currentQuestion<
questions.length-1){

currentQuestion++;

loadQuestion();

}else{

showResult();

}

};


function showResult(){

document
.getElementById("quiz")
.classList.add("hidden");

document
.getElementById("result")
.classList.remove("hidden");

progressBar.style.width="100%";


const scores={

affiliate:0,
sns:0,
web:0,
resale:0

};


answers.forEach(function(answer){

if(
answer==="shopping"||
answer==="noface"||
answer==="free"
){

scores.affiliate+=3;

}

if(
answer==="sns"||
answer==="face"
){

scores.sns+=3;

}

if(
answer==="pc"||
answer==="pcwork"||
answer==="skill"
){

scores.web+=3;

}

if(
answer==="shopping"||
answer==="income"
){

scores.resale+=2;

}

if(
answer==="high"||
answer==="investment"
){

scores.sns+=1;
scores.resale+=1;

}

});


const ranking=
Object.entries(scores)
.sort(function(a,b){
return b[1]-a[1];
});


const resultCards=
document.getElementById("resultCards");

resultCards.innerHTML="";


ranking.slice(0,3)
.forEach(function(item,index){

const key=item[0];

const result=data[key];

const card=
document.createElement("div");

card.className="result-card";


let steps="";

result.steps.forEach(function(step){

steps+="<li>"+step+"</li>";

});


card.innerHTML=

'<span class="rank">おすすめ '+(index+1)+'位</span>'+
'<span class="tag">'+result.tag+'</span>'+
'<h3>'+result.title+'</h3>'+
'<p>'+result.description+'</p>'+
'<strong>'+result.income+'</strong>'+
'<div class="start">'+
'<strong>始め方</strong>'+
'<ol>'+steps+'</ol>'+
'</div>'+
'<a class="detail-btn" href="#" onclick="comingSoon();return false;">'+
'詳しく見る'+
'</a>';

resultCards.appendChild(card);

});


window.scrollTo({
top:0,
behavior:"smooth"
});

}


function comingSoon(){

alert(
"このボタンには、あとからアフィリエイトリンクを設定できます。"
);

}


function lineComingSoon(){

alert(
"ここにあなたのLINE公式アカウントのURLを設定できます。"
);

}


document
.getElementById("shareButton")
.onclick=function(){

const text=
"副業ナビで無料副業診断をやってみた！";

const url=
location.href;


if(navigator.share){

navigator.share({

title:"副業ナビ",
text:text,
url:url

}).catch(function(){});

}else{

navigator.clipboard
.writeText(url)
.then(function(){

alert(
"診断ページのURLをコピーしました！"
);

})
.catch(function(){

alert(
"URL："+url
);

});

}

};


document
.getElementById("restartButton")
.onclick=function(){

currentQuestion=0;

answers=[];

document
.getElementById("result")
.classList.add("hidden");

document
.getElementById("quiz")
.classList.remove("hidden");

loadQuestion();

window.scrollTo({
top:0,
behavior:"smooth"
});

};


loadQuestion();

</script>

</body>
</html>
